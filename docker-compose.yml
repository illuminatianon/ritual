services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ritual
      POSTGRES_USER: ritual
      POSTGRES_PASSWORD: ritual_dev
    ports:
      - "5432:5432"
    volumes:
      - ritual_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritual -d ritual"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: pnpm dev --host 0.0.0.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ritual:ritual_dev@db:5432/ritual
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ritual_node_modules:/app/node_modules

volumes:
  ritual_pgdata:
  ritual_node_modules:
