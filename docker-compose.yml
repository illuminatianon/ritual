services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ritual
      POSTGRES_USER: ritual
      POSTGRES_PASSWORD: ritual_dev
    ports:
      - "5432:5432"
    volumes:
      - ritual_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritual -d ritual"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ritual_pgdata:
